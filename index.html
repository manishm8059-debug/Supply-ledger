<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Supply Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one column ledger. Brand strip, sticky tab bar (Entry / Hisab / Rate), cards below. Figures in mono so rupee columns line up. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface2:#F5F7FA; --ink:#14202E; --muted:#5B6B7E; --line:#D9E0E8;
  --accent:#1F4FB4; --accent-ink:#FFFFFF; --accent-soft:#E3ECFC;
  --warn:#8F5200; --warn-soft:#FCEFD0; --ok:#17794B; --danger:#B3261E;
  --f-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151D; --surface:#16202C; --surface2:#1B2837; --ink:#E7ECF3; --muted:#93A3B6; --line:#2A394A;
    --accent:#7BA3FF; --accent-ink:#0B1A33; --accent-soft:#1D2E4D;
    --warn:#F0B35A; --warn-soft:#3A2D12; --ok:#5FD39A; --danger:#FF8A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151D; --surface:#16202C; --surface2:#1B2837; --ink:#E7ECF3; --muted:#93A3B6; --line:#2A394A;
  --accent:#7BA3FF; --accent-ink:#0B1A33; --accent-soft:#1D2E4D;
  --warn:#F0B35A; --warn-soft:#3A2D12; --ok:#5FD39A; --danger:#FF8A80; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.brand{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-block:22px 14px}
.brand h1{font-size:30px;line-height:1.05}
.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.live{background:var(--ok)}
.role{border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--surface);color:var(--ink);font-weight:500}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;gap:4px;padding-block:6px;border-bottom:1px solid var(--line)}
.tab{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);font:600 15px var(--f-body);padding:11px 8px;border-radius:8px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab:not([aria-selected="true"]):hover{background:var(--surface)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:flex;flex-direction:column;gap:18px;padding-top:18px}
section[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h2{font-size:19px;margin-bottom:12px}
.card h3{font-size:16px;margin-bottom:8px}
.sub{color:var(--muted);font-size:13px;margin:-6px 0 12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid .full{grid-column:1/-1}
@media (max-width:520px){.grid{grid-template-columns:minmax(0,1fr)}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted);min-width:0}
input,select,textarea{font:400 16px var(--f-body);color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 11px;width:100%;min-width:0}
input[type=checkbox]{width:auto}
.pair{display:grid;grid-template-columns:minmax(0,1fr) 108px;gap:8px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px var(--f-body);padding:11px 16px;border-radius:8px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.danger{color:var(--danger)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface2);border-radius:10px;padding:12px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.stat b{display:block;font-family:var(--f-mono);font-weight:500;font-size:22px;margin-top:2px;overflow-wrap:anywhere}
.stat.warn{background:var(--warn-soft);color:var(--warn)}
.stat.warn small{color:var(--warn)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th.n,td.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
tr.sel td{background:var(--accent-soft)}
tfoot td{font-weight:600;border-bottom:0}
.lines{list-style:none;margin:0;padding:0}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:11px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line b{font-weight:600;overflow-wrap:anywhere}
.line .meta{color:var(--muted);font-size:13px;grid-column:1}
.line .amt{grid-column:2;grid-row:1;text-align:right;font-size:16px;font-weight:500}
.line .calc{grid-column:1/-1;font-size:13px;color:var(--ink);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.line .act{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.line .act input{width:120px;padding:6px 8px;font-size:14px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:22px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:17px;margin-bottom:4px}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px}
.hist{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.item{padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.item .top b{font-family:var(--f-display);font-size:17px;overflow-wrap:anywhere}
.item .cur{font-family:var(--f-mono);font-size:18px;white-space:nowrap}
.edit{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px;align-items:end}
.check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);grid-column:1/-1}
  .overlay{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;max-width:calc(100% - 32px);box-shadow:0 4px 18px rgba(0,0,0,.25)}
#toast[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){.tab,.chip,.btn{transition:background .12s,border-color .12s}}
</style>
</head>
<body>


<div class="wrap">
  <header class="brand">
    <div>
      <h1>Supply Ledger</h1>
      <p>Daily goods, rates and billing in one place.</p>
    </div>
    <div class="who"><span class="dot" id="dot"></span><span id="status">Loading</span><span class="role" id="role" hidden></span><button class="btn small" id="logout" type="button" hidden>Log out</button></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" id="t-entry" data-view="entry" aria-selected="true">Entry</button>
    <button class="tab" role="tab" id="t-hisab" data-view="hisab" aria-selected="false">Summary</button>
    <button class="tab" role="tab" id="t-rate" data-view="rate" aria-selected="false">Rates</button>
    <button class="tab" role="tab" id="t-partners" data-view="partners" aria-selected="false" hidden>Partners</button>
  </nav>

  <main>
    <div class="notice" id="banner" hidden></div>

    <!-- ENTRY -->
    <section id="v-entry" aria-labelledby="t-entry">
      <div class="card">
        <h2>What was taken?</h2>
        <p class="sub">Log what was taken. You see only your own entries. The owner adds rates and confirms each entry.</p>
        <form id="form" autocomplete="off">
          <div class="grid">
            <label class="f" for="f-date">Date<input id="f-date" type="date" required></label>
            <label class="f full" id="f-acct-wrap" for="f-acct" hidden>Record for partner account<select id="f-acct"></select></label>
            <label class="f" for="f-party">Party that took the goods<input id="f-party" list="dl-party" placeholder="e.g. Ravi Traders" required></label>
            <label class="f" for="f-cat">Category<select id="f-cat"><option>Polybag</option><option>Box</option><option>Other</option></select></label>
            <label class="f" for="f-item">Item / size<select id="f-item"></select></label>
            <label class="f full" id="f-new-wrap" for="f-new" hidden>New item name<input id="f-new" placeholder="e.g. Tape 2 inch"></label>
            <div class="f full">
              <span>Quantity</span>
              <div class="pair">
                <input id="f-qty" type="number" inputmode="decimal" step="any" min="0" placeholder="Qty" aria-label="Quantity" required>
                <select id="f-unit" aria-label="Unit"></select>
              </div>
            </div>
            <label class="f" id="f-rate-wrap" for="f-rate" hidden>Rate (only if this entry differs from the Rates tab)<input id="f-rate" type="number" inputmode="decimal" step="any" min="0" placeholder="Leave empty to use the Rates tab"></label>
            <label class="f full" for="f-note">Note (optional)<input id="f-note" placeholder="e.g. bill or challan no."></label>
          </div>
          <div class="row" style="margin-top:14px"><button class="btn primary" id="f-save" type="submit">Add entry</button><span class="sub" style="margin:0" id="f-msg"></span></div>
        </form>
        <datalist id="dl-party"></datalist>
        <datalist id="dl-item"></datalist>
      </div>
      <div class="card" style="margin-top:18px">
        <h2>Recent entries</h2>
        <div id="recent"></div>
      </div>
    </section>

    <!-- HISAB -->
    <section id="v-hisab" aria-labelledby="t-hisab" hidden>
      <div class="card">
        <h2>View summary</h2>
        <div class="chips" id="presets" role="group" aria-label="Choose period">
          <button class="chip" data-p="today" aria-pressed="false">Today</button>
          <button class="chip" data-p="7" aria-pressed="false">Last 7 days</button>
          <button class="chip" data-p="month" aria-pressed="true">This month</button>
          <button class="chip" data-p="all" aria-pressed="false">All time</button>
        </div>
        <div class="grid" style="margin-top:12px">
          <label class="f" for="x-from">From<input id="x-from" type="date"></label>
          <label class="f" for="x-to">To<input id="x-to" type="date"></label>
          <label class="f" for="x-party">Party<select id="x-party"></select></label>
          <label class="f" for="x-item">Item<select id="x-item"></select></label>
        </div>
      </div>
      <div id="summary" style="display:flex;flex-direction:column;gap:18px;margin-top:18px"></div>
    </section>

    <!-- PARTNERS -->
    <section id="v-partners" aria-labelledby="t-partners" hidden>
      <div id="partners"></div>
    </section>

    <!-- RATE -->
    <section id="v-rate" aria-labelledby="t-rate" hidden>
      <div id="rates"></div>
    </section>
  </main>
</div>
<div id="login" class="overlay" hidden>
  <form id="login-form" class="card" style="width:100%;max-width:360px" autocomplete="on">
    <h1 style="font-size:26px;margin-bottom:4px">Supply Ledger</h1>
    <p class="sub" style="margin:0 0 14px">Sign in with the email and password given by the owner.</p>
    <div class="grid" style="grid-template-columns:minmax(0,1fr)">
      <label class="f" for="lg-email">Email<input id="lg-email" type="email" autocomplete="username" required></label>
      <label class="f" for="lg-pass">Password<input id="lg-pass" type="password" autocomplete="current-password" required></label>
    </div>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="lg-go" type="submit" style="width:100%">Sign in</button></div>
    <p id="lg-msg" role="status" aria-live="polite" style="color:var(--danger);font-size:14px;min-height:20px;margin:10px 0 0"></p>
  </form>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>

/* ---------- state ---------- */
var CFG={url:'https://mgusaamguowurtvdzdbu.supabase.co',key:'sb_publishable_BLb_f2lh8y4y3fcgLs1v8Q_jSWLeaTA'};
var db=null,dl=true,uid=null,isOwner=false,canWrite=true,names={},profiles=[],me=null,ses=null;

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}

  all=entries.map(function(e){

      item:e.item,ik:ik,itemName:(m&&m.item)||itemDisp.get(ik)||norm(e.item),qty:e.qty,unit:e.unit||'',note:e.note||'',

  opensAll=opens.map(function(q){var pk=keyOf(q.party);return Object.assign({},q,{pk:pk,partyName:partyDisp.get(pk)||norm(q.party)})});

function filteredOpens(){

  });
}
function byName(id){if(!id)return '';if(names[id])return names[id];return (uid&&id!==uid)?'Owner':''}

function sbErr(e){var x=new Error(e);x.auth=true;return x}
async function auth(path,body){
  var r=await fetch(CFG.url+'/auth/v1/'+path,{method:'POST',headers:{apikey:CFG.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  var j=await r.json().catch(function(){return {}});
  if(!r.ok)throw sbErr(j.error_description||j.msg||j.message||'Sign in failed');
  return j;
}
function saveSes(j){ses={at:j.access_token,rt:j.refresh_token,uid:j.user.id,exp:Date.now()+(j.expires_in-60)*1000};lsSet('sl_ses',JSON.stringify(ses))}
async function token(){
  if(!ses)throw sbErr('login');
  if(Date.now()>ses.exp)saveSes(await auth('token?grant_type=refresh_token',{refresh_token:ses.rt}));
  return ses.at;
}
async function api(method,path,body,prefer){
  var t=await token();
  var h={apikey:CFG.key,Authorization:'Bearer '+t,'Content-Type':'application/json'};
  if(prefer)h.Prefer=prefer;

  }
  var n=doc.getNumberOfPages();
  for(var i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(120);doc.text('Page '+i+' / '+n,W-40,doc.internal.pageSize.getHeight()-20,{align:'right'})}
  await saveFile('supply-ledger_'+fileSafe(partyLabel())+'_'+stamp()+'.pdf',doc.output('blob'));
}

/* ---------- wiring ---------- */
function wire(){
  $$('.tab').forEach(function(b){b.addEventListener('click',function(){setView(b.dataset.view);try{history.replaceState(null,'','#'+b.dataset.view)}catch(e){}window.scrollTo(0,0)})});
  $('#presets').addEventListener('click',function(e){var c=e.target.closest('.chip');if(!c)return;setPreset(c.dataset.p);renderSummary()});
  $('#x-from').addEventListener('change',function(){F.from=this.value;F.preset='custom';$$('#presets .chip').forEach(function(c){c.setAttribute('aria-pressed','false')});renderSummary()});
  $('#x-to').addEventListener('change',function(){F.to=this.value;F.preset='custom';$$('#presets .chip').forEach(function(c){c.setAttribute('aria-pressed','false')});renderSummary()});
  $('#x-party').addEventListener('change',function(){F.party=this.value;renderSummary()});
  $('#x-item').addEventListener('change',function(){F.item=this.value;renderSummary()});
  $('#form').addEventListener('submit',addEntry);
  document.addEventListener('submit',function(e){if(e.target.id==='pay-form')addPayment(e);if(e.target.id==='open-form')addOpening(e)});
  $('#f-item').addEventListener('change',function(){var v=this.value;$('#f-new-wrap').hidden=v!=='__new__';if(v==='__new__')$('#f-new').focus();var u=unitFor(v);if(u&&UNITS.indexOf(u)>-1)$('#f-unit').value=u});
  $('#f-cat').addEventListener('change',function(){$('#f-item').value='';$('#f-new-wrap').hidden=true;fillLists()});
  document.addEventListener('click',function(e){
    var d=e.target.closest('[data-del]');
    if(d){
      if(d.dataset.armed){delEntry(d.dataset.del);return}
      d.dataset.armed='1';d.textContent='Confirm delete?';
      setTimeout(function(){if(d.isConnected){delete d.dataset.armed;d.textContent='Delete'}},3000);return;
    }
    var sp=e.target.closest('[data-savepartner]');if(sp){var card=sp.closest('[data-pid]');savePartner(sp.dataset.savepartner,norm(card.querySelector('.pt-name').value),norm(card.querySelector('.pt-party').value));return}
    var ed=e.target.closest('[data-edit]');if(ed){editId=ed.dataset.edit;renderRecent();renderSummary();return}
    var cn=e.target.closest('[data-cancel]');if(cn){editId=null;renderRecent();renderSummary();return}
    var sv=e.target.closest('[data-save]');if(sv){saveEdit(sv.dataset.save,sv.closest('.editbox'));return}
    var dop=e.target.closest('[data-delopen]');
    if(dop){
      if(dop.dataset.armed){delOpening(dop.dataset.delopen);return}
      dop.dataset.armed='1';dop.textContent='Confirm delete?';
      setTimeout(function(){if(dop.isConnected){delete dop.dataset.armed;dop.textContent='Delete'}},3000);return;
    }
    var dp=e.target.closest('[data-delpay]');
    if(dp){
      if(dp.dataset.armed){delPayment(dp.dataset.delpay);return}
      dp.dataset.armed='1';dp.textContent='Confirm delete?';
      setTimeout(function(){if(dp.isConnected){delete dp.dataset.armed;dp.textContent='Delete'}},3000);return;
    }
    var cf=e.target.closest('[data-conf]');if(cf){confirmRow(cf.dataset.conf);return}
    var uc=e.target.closest('[data-unconf]');if(uc){unconfirmRow(uc.dataset.unconf);return}
    var ca=e.target.closest('[data-confall]');if(ca){ca.disabled=true;confirmAll();return}
    var x=e.target.closest('[data-export]');
    if(x){x.dataset.export==='xlsx'?exportXlsx():exportPdf();return}
    var p=e.target.closest('tr[data-party]');
    if(p){F.party=F.party===p.dataset.party?'':p.dataset.party;$('#x-party').value=F.party;renderSummary()}
  });
  document.addEventListener('change',function(e){var o=e.target.closest&&e.target.closest('[data-ov]');if(o)setOverride(o.dataset.ov,o.value)});
  document.addEventListener('submit',async function(e){
    var f=e.target;
    if(f.id==='rate-add'){
      e.preventDefault();
      var name=norm($('#ra-name').value),rate=parseFloat($('#ra-rate').value);
      if(!name||!(rate>=0)){toast('Enter the item name and rate.');return}
      try{await saveRate(slug(name),name,$('#ra-unit').value,rate,todayISO(),false,$('#ra-cat').value);toast('Item added');f.reset()}
      catch(err){toast('Rate not saved. Only the owner can change rates.')}
    }else if(f.dataset&&f.dataset.rateForm){
      e.preventDefault();
      var fd=new FormData(f),r=parseFloat(fd.get('rate'));
      if(!(r>=0)){toast('Enter a rate.');return}
      try{await saveRate(f.dataset.rateForm,f.dataset.name,fd.get('unit'),r,fd.get('from'),!!fd.get('all'));toast('Rate applied')}
      catch(err){toast('Could not change the rate. Only the owner can change rates.')}
    }
  });
  document.addEventListener('focusout',function(){setTimeout(function(){if(ptDirty)renderPartners();if(rateDirty)renderRates();if(payDirty){payDirty=false;renderSummary();renderRecent()}},0)});
}

async function start(){
  $('#login').hidden=true;db=true;uid=ses.uid;
  try{var j=await api('GET','profiles?select=*&id=eq.'+uid);me=j[0]||null;isOwner=!!(me&&me.role==='owner')}catch(e){if(e.auth){showLogin('Please sign in again.');return}}
  $('#f-rate-wrap').hidden=!isOwner;renderStatus();
  await loadAll();
  setInterval(function(){if(!document.hidden&&db)loadAll()},20000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&db)loadAll()});
}
async function init(){
  wire();
  $('#f-date').value=todayISO();
  $('#f-unit').innerHTML=UNITS.map(function(u){return '<option>'+u+'</option>'}).join('');
  var lp=lsGet('sl-party');if(lp)$('#f-party').value=lp;
  setPreset('month');
  var h=(location.hash||'').replace('#','');if(h==='hisab'||h==='rate'||h==='entry')setView(h);
  renderAll();
  $('#logout').addEventListener('click',logout);
  $('#f-acct').addEventListener('change',function(){var p=profiles.filter(function(x){return x.id===$('#f-acct').value})[0];if(p&&p.party)$('#f-party').value=p.party});
  $('#login-form').addEventListener('submit',async function(e){
    e.preventDefault();var btn=$('#lg-go');btn.disabled=true;$('#lg-msg').textContent='';
    try{saveSes(await auth('token?grant_type=password',{email:$('#lg-email').value.trim(),password:$('#lg-pass').value}));await start()}
    catch(err){$('#lg-msg').textContent=err.auth?'Incorrect email or password.':'Check your internet connection.'}
    finally{btn.disabled=false}
  });
  try{ses=JSON.parse(lsGet('sl_ses')||'null')}catch(e){ses=null}
  if(CFG.url.indexOf('PASTE_')===0||!ses){showLogin();return}
  await start();
}
init();
})();
</script>
